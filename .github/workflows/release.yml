name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: clojars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: clojars

    steps:
    - uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Clojure CLI
      uses: DeLaGuardo/setup-clojure@13
      with:
        cli: 1.12.5.1654

    - name: Cache Clojure dependencies
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-release-m2-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-release-m2-

    - name: Set release version
      run: |
        if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "Expected a release tag such as v1.2.3 or v1.2.3-rc1"
          exit 1
        fi
        echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Run tests
      run: clojure -X:test

    - name: Build JAR
      run: clojure -T:build jar

    - name: Publish to Clojars
      env:
        CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
        CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
      run: clojure -T:build deploy
